<!doctype html>
<html lang="en" class="wa-theme-default wa-palette-default wa-brand-blue">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Personal site of sagreen." />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <wa-page mobile-breakpoint="768" style="--menu-width: 240px;">
      <header slot="header" class="wa-cluster wa-gap-m" style="padding: var(--wa-space-m) var(--wa-space-l); justify-content: space-between;">

      <nav slot="navigation" class="wa-stack wa-gap-xs" style="padding: var(--wa-space-m);">

        <div class="wa-cluster wa-gap-s">
          <a href="https://github.com/sagreenxyz" aria-label="GitHub">
